# Replaces the agent's own `curl` to Jira rule 2, so the rule 2 secret lives in
# Actions secrets instead of the routine prompt. Commit this to main.
#
# Secrets (Settings > Secrets and variables > Actions):
#   JIRA_PR_READY_WEBHOOK  rule 2's incoming webhook URL
#   JIRA_PR_READY_SECRET   rule 2's webhook secret

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: jira-pr-ready-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  notify:
    # Agent PRs only, and only from branches in this repo (fork PRs get no secrets).
    if: >-
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Tell Jira the PR is ready
        env:
          # Passed through env, never interpolated into the script.
          BRANCH: ${{ github.head_ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          JIRA_URL: ${{ secrets.JIRA_PR_READY_WEBHOOK }}
          JIRA_TOKEN: ${{ secrets.JIRA_PR_READY_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$JIRA_URL" ] || [ -z "$JIRA_TOKEN" ]; then
            echo "::error::JIRA_PR_READY_WEBHOOK and JIRA_PR_READY_SECRET must both be set."
            exit 1
          fi

          # Branch format: claude/<ISSUE-KEY>-<slug>
          if [[ ! "$BRANCH" =~ ^claude/([A-Z][A-Z0-9_]+-[0-9]+)(-|$) ]]; then
            echo "::warning::No Jira key found in branch '$BRANCH'; nothing sent."
            exit 0
          fi
          KEY="${BASH_REMATCH[1]}"

          body="$(jq -cn --arg key "$KEY" --arg url "$PR_URL" '{issues: [$key], prUrl: $url}')"

          # Jira answers 200 even when the secret is wrong; check the rule's audit log.
          curl -sS --fail-with-body -X POST "$JIRA_URL" \
            -H "Content-Type: application/json" \
            -H "X-Automation-Webhook-Token: $JIRA_TOKEN" \
            -d "$body"
          echo "Sent $KEY -> $PR_URL"
