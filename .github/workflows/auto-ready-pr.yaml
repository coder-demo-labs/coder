name: Ready Claude PRs
on:
  pull_request:
    types: [opened]
permissions: {}
jobs:
  ready:
    if: github.event.pull_request.draft && startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr ready "$PR_URL"
