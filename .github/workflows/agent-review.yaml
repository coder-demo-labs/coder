name: Agent review loop
on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  push:
    branches: ['claude/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  send-back:
    if: >-
      (github.event_name == 'pull_request_review' &&
       (github.event.review.state == 'changes_requested' || startsWith(github.event.review.body, '/agent')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/agent') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Send notes to Jira
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          BODY: ${{ github.event.review.body || github.event.comment.body }}
          REVIEWER: ${{ github.event.review.user.login || github.event.comment.user.login }}
          JIRA_PR_WEBHOOK: ${{ secrets.JIRA_PR_WEBHOOK }}
          JIRA_PR_WORKFLOW: ${{ secrets.JIRA_PR_WORKFLOW }}
        run: |
          set -euo pipefail
          read -r BRANCH PR_URL <<<"$(gh pr view "$PR" --repo "$REPO" --json headRefName,url --jq '"\(.headRefName) \(.url)"')"
          case "$BRANCH" in claude/*) ;; *) echo "Not an agent branch: $BRANCH"; exit 0 ;; esac
          KEY=$(printf '%s' "$BRANCH" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -n1 || true)
          [ -n "$KEY" ] || { echo "No issue key in $BRANCH"; exit 0; }
          NOTES=${BODY#/agent}
          if [ "$EVENT" = "pull_request_review" ]; then
            COMMENTS=$(gh api "repos/$REPO/pulls/$PR/reviews/$REVIEW_ID/comments" \
              --jq '.[] | "- \(.path) (line \(.line // .original_line // "?")): \(.body)"')
            NOTES=$(printf '%s\n%s' "$NOTES" "$COMMENTS")
          fi
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then echo "No notes to send"; exit 0; fi
          jq -n --arg k "$KEY" --arg u "$PR_URL" --arg b "$BRANCH" --arg r "$REVIEWER" --arg n "$NOTES" \
            '{issues:[$k],data:{prUrl:$u,branch:$b,reviewer:$r,notes:$n}}' |
            curl -fsS -X POST "$JIRA_PR_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -H "X-Automation-Webhook-Token: $JIRA_PR_WORKFLOW" \
              --data @-
          gh pr comment "$PR" --repo "$REPO" --body "Sent to the agent. $KEY is back in In Progress; I'll comment here when it pushes."

  report-change:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comment on the PR (and fold in stray branches)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          KEY=$(printf '%s' "$BRANCH" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -n1 || true)
          [ -n "$KEY" ] || { echo "No issue key in $BRANCH"; exit 0; }
          SUBJECT=$(git log -1 --format=%s "$SHA")
          PRS=$(gh pr list --repo "$REPO" --state open --json number,headRefName)

          # Pushed to the PR's own branch: just comment.
          SAME=$(printf '%s' "$PRS" | jq -r --arg b "$BRANCH" '.[] | select(.headRefName == $b) | .number' | head -n1)
          if [ -n "$SAME" ]; then
            gh pr comment "$SAME" --repo "$REPO" \
              --body "The agent pushed ${SHA:0:7}: $SUBJECT. Ready for another look."
            exit 0
          fi

          # Pushed to a different branch for the same ticket: merge it into the PR's branch.
          NUM=""; HEAD=""
          read -r NUM HEAD <<<"$(printf '%s' "$PRS" | jq -r --arg k "$KEY" \
            '[.[] | select(.headRefName | test("^claude/" + $k + "([^0-9]|$)"))][0] // empty | "\(.number) \(.headRefName)"')" || true
          [ -n "$NUM" ] || { echo "No open PR for $KEY yet (first push)"; exit 0; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$HEAD" "origin/$HEAD"
          if git merge --no-edit "origin/$BRANCH"; then
            git push origin "HEAD:$HEAD"
            git push origin --delete "$BRANCH"
            gh pr comment "$NUM" --repo "$REPO" \
              --body "The agent pushed its follow-up to \`$BRANCH\`. Merged into this PR (${SHA:0:7}: $SUBJECT). Ready for another look."
          else
            git merge --abort || true
            gh pr comment "$NUM" --repo "$REPO" \
              --body "The agent pushed its follow-up to \`$BRANCH\`, but it doesn't merge cleanly into this PR: https://github.com/$REPO/compare/$HEAD...$BRANCH"
          fi
